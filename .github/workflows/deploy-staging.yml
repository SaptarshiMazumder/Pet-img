name: Deploy to staging

on:
  workflow_dispatch: # you trigger this manually — no auto-deploys

jobs:
  deploy-backend:
    name: Deploy backend to Cloud Run (staging)
    runs-on: ubuntu-latest
    environment: staging # pauses for YOUR approval (the 5a gate)
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: pet-gen-dev

      - name: Configure Docker to push to GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push the backend image to GCR
        run: |
          docker build -f backend/Dockerfile -t gcr.io/pet-gen-dev/pet-backend-staging:${{ github.sha }} .
          docker push gcr.io/pet-gen-dev/pet-backend-staging:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy pet-backend-staging \
            --image gcr.io/pet-gen-dev/pet-backend-staging:${{ github.sha }} \
            --region asia-northeast1 \
            --platform managed \
            --allow-unauthenticated
