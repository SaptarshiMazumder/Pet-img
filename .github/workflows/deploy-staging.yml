name: Deploy to staging

on:
  workflow_dispatch:

env:
  IMAGE: asia-northeast1-docker.pkg.dev/gen-lang-client-0545494042/pet-img-backend-containers/pet-backend-staging

jobs:
  deploy-backend:
    name: Deploy backend to Cloud Run (staging)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: gen-lang-client-0545494042

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and push the backend image
        run: |
          docker build -f backend/Dockerfile -t ${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy pet-backend-staging \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region asia-northeast1 \
            --platform managed \
            --allow-unauthenticated

      - name: Smoke test the deploy
        run: |
          URL=$(gcloud run services describe pet-backend-staging --region asia-northeast1 --format='value(status.url)')
          echo "Health-checking $URL/health"
          curl -fsS "$URL/health" | grep -q '"ok"' && echo "PASS: backend is healthy" || (echo "FAIL: smoke test did not pass" && exit 1)
