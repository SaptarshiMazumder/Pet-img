name: Deploy to staging

on:
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy backend to Cloud Run (staging)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: pet-gen-dev

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and push the backend image
        run: |
          docker build -f backend/Dockerfile -t asia-northeast1-docker.pkg.dev/pet-gen-dev/containers/pet-backend-staging:${{ github.sha }} .
          docker push asia-northeast1-docker.pkg.dev/pet-gen-dev/containers/pet-backend-staging:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy pet-backend-staging \
            --image asia-northeast1-docker.pkg.dev/pet-gen-dev/containers/pet-backend-staging:${{ github.sha }} \
            --region asia-northeast1 \
            --platform managed \
            --allow-unauthenticated
